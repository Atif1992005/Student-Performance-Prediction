# ==============================================================================
# Student Academic Risk Prediction System - Development Mode Override
# ==============================================================================
# Usage:
#   docker compose -f compose.yaml -f compose.dev.yaml up
#
# This file mounts local source directories into the containers so that any
# changes to React code or Python ML code are immediately reflected without
# needing to re-build Docker images.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # ML Service with Live Python Reloading
  # ----------------------------------------------------------------------------
  ml-service:
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./ml:/app
    environment:
      - PYTHONUNBUFFERED=1

  # ----------------------------------------------------------------------------
  # Frontend with Hot Module Replacement (Vite Dev Server)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
