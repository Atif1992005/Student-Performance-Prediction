# ==============================================================================
# Student Academic Risk Prediction System - Production / Portable Docker Compose
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. MySQL 8.0 Database Service with Persistent Volume and Auto-Seed Data
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: stud-risk-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_academic_risk}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
    volumes:
      # Persistent named volume preserves all student and user records across restarts
      - mysql_data:/var/lib/mysql
      # Initial database seed script (66 enrolled students + auth accounts)
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Maps to 3306 on a new PC; can be overridden via .env if host port 3306 is in use
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - student-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. Python FastAPI Machine Learning Service
  # ----------------------------------------------------------------------------
  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    image: student-academic-risk-ml:latest
    container_name: stud-risk-ml
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8000}:8000"
    networks:
      - student-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 3. Spring Boot Backend API Service (Java 21)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: student-academic-risk-backend:latest
    container_name: stud-risk-backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      ML_SERVICE_BASE_URL: http://ml-service:8000
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - student-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/students || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  # ----------------------------------------------------------------------------
  # 4. React Vite Frontend with High-Performance Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: student-academic-risk-frontend:latest
    container_name: stud-risk-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Exposes application on standard port 5173
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - student-network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
    name: student_risk_mysql_data

# ------------------------------------------------------------------------------
# Internal Container Network
# ------------------------------------------------------------------------------
networks:
  student-network:
    name: student_risk_network
    driver: bridge
